name: EufyGuard
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"
targets:
  EufyGuard:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: EufyGuard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© Vincent Lauriat"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SUFeedURL: "https://raw.githubusercontent.com/vincentlauriat/EufyGuard/main/appcast.xml"
        SUPublicEDKey: "xV1M6deOtWGENHNEH/GMIbaFmSFM9cJhNOeN9jV1JNE="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.EufyGuard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
    postCompileScripts:
      - name: "Rebuild full AppIcon.icns (workaround actool thinning)"
        script: |
          set -eu
          ICONSET_SRC="${SRCROOT}/Sources/Assets.xcassets/AppIcon.appiconset"
          TMP=$(mktemp -d)
          ICONSET="$TMP/AppIcon.iconset"
          mkdir "$ICONSET"
          cp "$ICONSET_SRC"/icon_*.png "$ICONSET/"
          iconutil -c icns "$ICONSET" -o "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Resources/AppIcon.icns"
        basedOnDependencyAnalysis: false
