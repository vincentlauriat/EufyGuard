<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <clipPath id="win"><rect width="1200" height="760" rx="14"/></clipPath>
    <linearGradient id="nightIR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c281e"/><stop offset="1" stop-color="#0a100b"/>
    </linearGradient>
    <radialGradient id="irGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#c8e8cf" stop-opacity="0.22"/><stop offset="1" stop-color="#c8e8cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.65"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="botFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#win)">
    <!-- video frame : garden at night (IR) -->
    <rect width="1200" height="760" fill="url(#nightIR)"/>
    <rect width="1200" height="760" fill="url(#irGlow)"/>
    <!-- trees -->
    <ellipse cx="150" cy="420" rx="130" ry="180" fill="#0f1712"/><rect x="138" y="520" width="26" height="240" fill="#0b110c"/>
    <ellipse cx="1080" cy="380" rx="150" ry="200" fill="#0f1712"/><rect x="1066" y="500" width="28" height="260" fill="#0b110c"/>
    <!-- hedge + gate -->
    <rect x="0" y="560" width="1200" height="60" fill="#0d1610"/>
    <rect x="700" y="470" width="240" height="150" fill="#131d15"/>
    <g stroke="#1e2c20" stroke-width="6"><line x1="730" y1="470" x2="730" y2="620"/><line x1="770" y1="470" x2="770" y2="620"/><line x1="810" y1="470" x2="810" y2="620"/><line x1="850" y1="470" x2="850" y2="620"/><line x1="890" y1="470" x2="890" y2="620"/></g>
    <!-- lawn -->
    <rect x="0" y="620" width="1200" height="140" fill="#101a12"/>
    <!-- person silhouette near the gate -->
    <g fill="#050807">
      <circle cx="600" cy="430" r="17"/>
      <rect x="583" y="448" width="34" height="72" rx="12"/>
      <rect x="586" y="518" width="12" height="60" rx="5"/><rect x="602" y="518" width="12" height="60" rx="5"/>
    </g>
    <!-- AI detection box -->
    <rect x="556" y="400" width="90" height="185" rx="6" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
    <rect x="556" y="376" width="128" height="24" rx="6" fill="#2dd4bf"/>
    <text x="620" y="393" text-anchor="middle" font-size="12.5" font-weight="700" fill="#071018">Personne · 94 %</text>

    <!-- overlays -->
    <rect width="1200" height="110" fill="url(#topFade)"/>
    <rect y="640" width="1200" height="120" fill="url(#botFade)"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
    <text x="600" y="25" text-anchor="middle" font-size="13" fill="#c3cfe2">Direct — Jardin</text>

    <rect x="24" y="56" width="74" height="28" rx="14" fill="#e11d48"/>
    <circle cx="42" cy="70" r="4" fill="#ffffff"/>
    <text x="54" y="75" font-size="13" font-weight="700" fill="#ffffff">LIVE</text>
    <rect x="106" y="56" width="150" height="28" rx="14" fill="#000000" opacity="0.55"/>
    <text x="181" y="75" text-anchor="middle" font-size="12.5" fill="#e9eef8">H.265 · 2K · 15 i/s</text>

    <rect x="912" y="56" width="264" height="28" rx="14" fill="#000000" opacity="0.55"/>
    <text x="1030" y="75" text-anchor="middle" font-size="12.5" fill="#e9eef8">Jardin — eufyCam S340</text>
    <rect x="1146" y="64" width="18" height="11" rx="2.5" fill="none" stroke="#9fe8b8" stroke-width="1.5"/>
    <rect x="1165" y="67" width="2.5" height="5" rx="1" fill="#9fe8b8"/>
    <rect x="1148.5" y="66.5" width="12" height="6" rx="1.2" fill="#9fe8b8"/>

    <!-- timestamp -->
    <rect x="24" y="708" width="150" height="22" rx="5" fill="#000000" opacity="0.55"/>
    <text x="34" y="724" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#ffffff">07/08/2026 22:04:37</text>

    <!-- bottom-left buttons -->
    <g>
      <circle cx="240" cy="702" r="22" fill="#000000" opacity="0.55"/>
      <rect x="229" y="695" width="22" height="15" rx="3" fill="none" stroke="#e9eef8" stroke-width="1.8"/>
      <circle cx="240" cy="702.5" r="4" fill="none" stroke="#e9eef8" stroke-width="1.8"/>
      <circle cx="298" cy="702" r="22" fill="#000000" opacity="0.55"/>
      <text x="298" y="707" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e9eef8">360°</text>
      <circle cx="356" cy="702" r="22" fill="#000000" opacity="0.55"/>
      <polygon points="348,698 353,698 359,692 359,712 353,706 348,706" fill="#e9eef8"/>
      <line x1="363" y1="697" x2="363" y2="707" stroke="#e9eef8" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- PTZ pad -->
    <circle cx="1096" cy="656" r="66" fill="#0a0e16" opacity="0.65"/>
    <circle cx="1096" cy="656" r="66" fill="none" stroke="#3a4a62" stroke-width="1.5"/>
    <circle cx="1096" cy="656" r="16" fill="#1c2b3f" stroke="#3a4a62"/>
    <polygon points="1096,606 1088,620 1104,620" fill="#e9eef8"/>
    <polygon points="1096,706 1088,692 1104,692" fill="#e9eef8"/>
    <polygon points="1046,656 1060,648 1060,664" fill="#e9eef8"/>
    <polygon points="1146,656 1132,648 1132,664" fill="#e9eef8"/>
  </g>
  <rect width="1199" height="759" x="0.5" y="0.5" rx="14" fill="none" stroke="#243248"/>
</svg>
